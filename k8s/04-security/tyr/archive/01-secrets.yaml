# Secrets required by tyr-archive CronJobs.
# Each customer Mac mini populates these via Vault during deployment per
# Asgard/docs/technical/cloud-archive/runbook.md §1 First-time setup.
#
# This file is the SHAPE — never commit real values.
---
apiVersion: v1
kind: Secret
metadata:
  name: tyr-archive-gcp-sa
  namespace: asgard-archive
  labels:
    app.kubernetes.io/part-of: tyr-archive
type: Opaque
stringData:
  # GCP service account JSON with roles/storage.objectCreator scoped to
  # tenants/<tenant_id>/* via IAM Condition (runbook §1 step 2).
  sa-key.json: |
    {"REPLACE": "issued by Megawiz ops; rotated quarterly"}

---
apiVersion: v1
kind: Secret
metadata:
  name: tyr-archive-license
  namespace: asgard-archive
  labels:
    app.kubernetes.io/part-of: tyr-archive
type: Opaque
stringData:
  # Yggdrasil-signed RS256 JWT proving Commercial tier + cloud-archive feature.
  # Daemon validates against the JWKS URL from catalog.toml.
  license.jwt: REPLACE_WITH_YGGDRASIL_ISSUED_JWT

---
apiVersion: v1
kind: Secret
metadata:
  name: tyr-archive-wazuh
  namespace: asgard-archive
  labels:
    app.kubernetes.io/part-of: tyr-archive
type: Opaque
stringData:
  # Until SA-token auth lands in V2, the daemon authenticates to
  # wazuh-indexer with the demo admin/admin pair scoped to dev only.
  user: admin
  pass: admin

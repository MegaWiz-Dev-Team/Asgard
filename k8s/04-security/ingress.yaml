# 🏰 Asgard — Traefik Ingress Routes
# Exposes all services via clean URLs on asgard.local

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asgard-ingress
  namespace: asgard
  annotations:
    cert-manager.io/cluster-issuer: "asgard-ca-issuer"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Security response headers (Odin 2026-06-14 scan, Asgard#99 — PR-1).
    # Applied at the single shared ingress so every fronted host gets them at once.
    # Conservative set only: no source-restricting CSP (default-src/script-src),
    # which would break inline-script/style UIs (portal, mimir-dashboard) — that
    # stricter CSP is tracked as a follow-up. `frame-ancestors 'self'` is the
    # modern anti-clickjacking control and is safe (it restricts framing only).
    # Requires `allow-snippet-annotations: "true"` on the ingress-nginx controller.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: frame-ancestors 'self'";
      more_clear_headers "Server";
spec:
  tls:
    - hosts: ["*.asgard.internal", "portal.asgard.internal", "asgard.internal"]
      secretName: asgard-tls-secret
  rules:
    - host: asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asgard-portal
                port: { number: 30005 }
    - host: launchpad.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asgard-portal
                port: { number: 30005 }
    - host: portal.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asgard-portal
                port: { number: 30005 }
    - host: mimir.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mimir-dashboard
                port: { number: 3000 }
    - host: api.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mimir-api
                port: { number: 8080 }
    - host: bifrost.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bifrost
                port: { number: 8100 }
    - host: fenrir.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fenrir
                port: { number: 8200 }
    - host: forseti.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forseti
                port: { number: 5555 }
    # vault.asgard.internal moved to its own Ingress (fafnir/04-ingress-csp.yaml)
    # so a tightened, Vault-specific CSP can be applied without affecting the
    # other hosts on this shared Ingress. See Asgard#100.
    - host: monitor.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vardr
                port: { number: 9090 }
    - host: sso.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yggdrasil
                port: { number: 8080 }
    - host: ehr.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eir
                port: { number: 80 }
    - host: laminar.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: laminar-frontend
                port: { number: 5667 }

---
# ServiceAccount for Loki
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: asgard
  labels:
    app: loki
    tier: security-testing

---
# Role - minimal permissions for Loki
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki
  namespace: asgard
spec:
  rules:
  # Read-only access to config maps (test payloads, scripts)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Read pod info for testing
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Read service endpoints
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]

---
# RoleBinding - attach role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki
  namespace: asgard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki
subjects:
- kind: ServiceAccount
  name: loki
  namespace: asgard

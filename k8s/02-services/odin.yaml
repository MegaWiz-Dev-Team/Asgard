# 🟣 Odin — (External image from ghcr)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odin
  namespace: asgard
  labels:
    app: odin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odin
  template:
    metadata:
      labels:
        app: odin
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: odin
        image: ghcr.io/megawiz-dev-team/asgard-odin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: asgard-secrets
            optional: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: odin
  namespace: asgard
spec:
  selector:
    app: odin
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP

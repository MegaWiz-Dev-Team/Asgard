# 🧠 Mimir Dashboard — Next.js UI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-dashboard
  namespace: asgard
  labels:
    app: mimir-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir-dashboard
  template:
    metadata:
      labels:
        app: mimir-dashboard
    spec:
      containers:
        - name: mimir-dashboard
          image: asgard-mimir-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://mimir-api.asgard.svc:8080
            - name: NEXT_PUBLIC_YGGDRASIL_URL
              value: http://yggdrasil.asgard.svc:8080
            # Server-side override for /api/auth/callback — NEXT_PUBLIC_* is inlined
            # at build time, so this runtime var is required to reach mimir-api over
            # cluster-internal HTTP instead of the public HTTPS endpoint (whose cert
            # Node's undici can't verify without NODE_EXTRA_CA_CERTS).
            - name: MIMIR_API_URL
              value: http://mimir-api.asgard.svc:8080/api
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-dashboard
  namespace: asgard
spec:
  selector:
    app: mimir-dashboard
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
  type: NodePort

# Mosquitto — MQTT broker for Nótt Box telemetry (nott/v1/{site}/{device}/…)
#
# v0.1: plain listener 1883, ClusterIP ONLY (in-cluster consumers: nott-box-edge).
# Before ANY exposure beyond the cluster (NodePort/LB for LAN devices): add the
# mTLS listener 8883 with certs from the Asgard internal CA (SPEC §3.1) —
# devices authenticate with per-device client certs, never anonymous.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: asgard-infra
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    max_queued_messages 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: asgard-infra
  labels:
    app: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: data
              mountPath: /mosquitto/data
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 200m
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: asgard-infra
spec:
  selector:
    app: mosquitto
  ports:
    - port: 1883
      targetPort: 1883

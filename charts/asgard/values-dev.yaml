# values-dev.yaml — Local development overrides
#
# 🔐 Secrets handling:
#   Dev uses Helm-managed secrets (`secrets.create: true`, the chart default).
#   Set strong-but-non-prod values for the required keys via:
#     helm upgrade asgard ./charts/asgard -n asgard \
#       -f values-dev.yaml \
#       --set-file secrets.yggdrasil.masterKey=./dev-secrets/masterkey \
#       (and so on)
#
#   To skip per-key flags, drop a values-dev-secrets.yaml (gitignored)
#   alongside this file with all the `required` values populated.
global:
  imagePullPolicy: IfNotPresent  # pull from ghcr.io if not present locally
  imagePullSecret: ghcr-secret   # private ghcr.io packages — secret pre-created in asgard ns
  infraNamespace: asgard-infra
  heimdallUrl: http://host.docker.internal:8080/v1
  ollamaUrl: http://192.168.1.172:8080

bifrost:
  defaultModel: mlx-community/Qwen3.5-9B-MLX-4bit
  maxIterations: 10

# Match current PVC capacity in cluster (k8s forbids shrinking bound PVCs)
infra:
  mariadb:
    storage: 10Gi
  postgres:
    storage: 5Gi
  qdrant:
    storage: 10Gi
  neo4j:
    storage: 2Gi

# Yggdrasil (Zitadel) running in TLS-external mode behind ingress sso.asgard.internal
yggdrasil:
  externalSecure: "true"
  externalDomain: sso.asgard.internal
  externalPort: "443"
  tlsMode: external
  readinessPath: /debug/healthz

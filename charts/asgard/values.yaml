# 🏰 Asgard AI Platform — Base Values
# Override with values-dev.yaml or values-prod.yaml

global:
  namespace: asgard
  infraNamespace: asgard-infra  # mariadb/postgres/qdrant/redis/neo4j live here
  imagePullPolicy: Never  # local images; change to IfNotPresent for registry
  heimdallUrl: http://host.docker.internal:8080/v1  # OpenAI-compat path required for bifrost
  ollamaUrl: http://host.docker.internal:8080  # legacy ollama path (no /v1)
  rustLog: info
  logLevel: info

# ── Shared Secrets ──
secrets:
  heimdallApiKey: ""
  jwtSecret: ""
  geminiApiKey: ""
  geminiBaseUrl: ""
  geminiModel: ""

# ── Infrastructure ──
infra:
  enabled: true
  laminarApiKey: "UZfUPh7uU6Z75uQeeVpuED3HpjcJM3BBL7UnYIlkd18AseLjvrjIVnU9MoXGptVC"
  mariadb:
    rootPassword: root
    database: mimir
    user: mimir
    password: REDACTED-PW
    storage: 10Gi
  postgres:
    user: postgres
    password: yggdrasil-secret
    database: zitadel
    storage: 5Gi
  redis:
    enabled: true
  qdrant:
    storage: 10Gi

# ── Auth ──
yggdrasil:
  enabled: true
  image: ghcr.io/zitadel/zitadel:v2.71.6
  masterKey: yggdrasil-masterkey-change-me-ok
  nodePort: 30085
  externalSecure: "false"
  externalDomain: localhost
  externalPort: "30085"
  tlsMode: disabled
  readinessPath: /debug/ready

# ── Knowledge Platform ──
mimir:
  enabled: true
  api:
    image: asgard-mimir-api:latest
    nodePort: 30000
    resources:
      requests: { memory: 256Mi, cpu: 200m }
      limits: { memory: 1Gi, cpu: "1" }
  dashboard:
    image: asgard-mimir-dashboard:latest
    nodePort: 30001

# ── Agent Runtime ──
bifrost:
  enabled: true
  image: asgard-bifrost:latest
  nodePort: 30100
  defaultModel: mlx-community/Qwen3.5-9B-MLX-4bit
  maxIterations: 10
  maxExecutionTime: 120

# ── Computer-Use Agent ──
fenrir:
  enabled: true
  image: asgard-fenrir:latest
  nodePort: 30200

# ── E2E Testing ──
forseti:
  enabled: true
  image: asgard-forseti:latest
  nodePort: 30555
  storage: 1Gi

# ── MCP Sidecar ──
hermodr:
  enabled: true
  image: asgard-hermodr-yggdrasil:latest

# ── Browser Service ──
ratatoskr:
  enabled: true
  image: asgard-ratatoskr:latest

# ── Load Testing ──
mjolnir:
  enabled: true
  image: asgard-mjolnir:latest
  storage: 1Gi



# ── Laminar (Sága) ──
# Disabled in umbrella chart — managed by separate `laminar` Helm release.
# Re-enabling requires migrating ownership of 45 laminar resources first.
laminar:
  enabled: false

# ── Monitoring ──
vardr:
  enabled: true
  image: asgard-vardr:latest
  nodePort: 30090

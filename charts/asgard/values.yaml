# 🏰 Asgard AI Platform — Base Values
# Override with values-dev.yaml or values-prod.yaml

global:
  namespace: asgard
  infraNamespace: asgard-infra  # mariadb/postgres/qdrant/redis/neo4j live here
  # Name of the K8s Secret that subcharts reference via secretKeyRef.
  # Default "asgard-secrets" — overridable for multi-tenant or
  # per-env Secret naming (e.g. ESO + cluster-scoped Secret store).
  secretsName: asgard-secrets
  # CI-driven image flow: pulls from ghcr.io built by Build-and-Push workflow
  imageRegistry: ghcr.io/megawiz-dev-team
  # Always re-pull on rollout — `:latest` is mutable and a cached local
  # image will silently shadow a fresh ghcr push otherwise.
  imagePullPolicy: Always
  # Optional: name of pre-existing imagePullSecret if ghcr.io packages are private.
  # Create with: kubectl create secret docker-registry ghcr-secret \
  #   --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT> -n <ns>
  imagePullSecret: ""
  heimdallUrl: http://heimdall-host.asgard.svc:8080/v1  # K8s service DNS (ExternalName)
  heimdallExternalName: host.docker.internal  # Set to actual hostname for ExternalName service
  ollamaUrl: http://heimdall-host.asgard.svc:8080  # legacy ollama path (no /v1)
  rustLog: info
  logLevel: info

# ── Shared Secrets ──
# All secrets are stored in a central K8s Secret resource named
# `asgard-secrets`. Subcharts reference values via secretKeyRef.
#
# Two modes:
#   • create: true   — Helm manages the Secret from values below (dev/test).
#                      Provide values via --set, --set-file, or values-*.yaml.
#                      Plaintext defaults are intentionally absent so empty
#                      strings/missing values fail fast via `required`.
#   • create: false  — Operator pre-creates a Secret with the same name
#                      "asgard-secrets" in the release namespace (prod /
#                      Vault Agent Injector / Sealed Secrets / ESO).
#
# To rotate any secret in the running cluster:
#   1. Update the upstream system (Zitadel admin UI, Postgres, etc.)
#   2. kubectl create secret generic asgard-secrets --from-literal=... \
#        --dry-run=client -o yaml | kubectl apply -f - -n asgard
#   3. Restart consumers: kubectl rollout restart deploy -n asgard
#
# See docs/security/SECRETS.md for the full rotation runbook.
secrets:
  create: true

  # Yggdrasil / Zitadel OIDC
  yggdrasil:
    masterKey: ""           # ZITADEL_MASTERKEY (rotation invalidates all sessions)
    postgresPassword: ""    # ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    clientId: ""            # OIDC client ID (registered in Zitadel)
    clientSecret: ""        # OIDC client secret (regen in Zitadel admin UI)

  # Infra databases
  mariadb:
    rootPassword: ""
    password: ""            # mimir DB user password
  neo4j:
    password: ""

  # Optional — external services
  heimdallApiKey: ""
  jwtSecret: ""
  geminiApiKey: ""
  geminiBaseUrl: ""
  geminiModel: ""

  # Eir (OpenEMR + Asgard agent integration)
  eir:
    clientId: ""
    clientSecret: ""

  # Laminar (Sága) — disabled in umbrella; kept for completeness.
  laminar:
    apiKey: ""
    postgresPassword: ""
    clickhousePassword: ""
    clickhouseRoPassword: ""
    nextauthSecret: ""

# ── Infrastructure ──
# DB credentials are NOT defined here — see `secrets:` section above.
# Only non-sensitive structural config (sizes, db names, storage) below.
infra:
  enabled: true
  mariadb:
    database: mimir
    user: mimir
    storage: 10Gi
  postgres:
    user: postgres
    database: zitadel
    storage: 5Gi
  redis:
    enabled: true
  qdrant:
    storage: 10Gi

# ── Auth ──
# masterKey + postgres password come from the asgard-secrets K8s Secret.
yggdrasil:
  enabled: true
  image: ghcr.io/zitadel/zitadel:v2.71.6
  nodePort: 30085
  externalSecure: "false"
  externalDomain: localhost
  externalPort: "30085"
  tlsMode: disabled
  readinessPath: /debug/ready

# ── Knowledge Platform ──
mimir:
  enabled: true
  api:
    image: ghcr.io/megawiz-dev-team/mimir-api:latest
    nodePort: 30000
    resources:
      requests: { memory: 256Mi, cpu: 200m }
      limits: { memory: 1Gi, cpu: "1" }
  dashboard:
    image: ghcr.io/megawiz-dev-team/mimir-dashboard:latest
    nodePort: 30001

# ── Agent Runtime ──
bifrost:
  enabled: true
  image: ghcr.io/megawiz-dev-team/bifrost:latest
  nodePort: 30100
  defaultModel: mlx-community/Qwen3.5-9B-MLX-4bit
  maxIterations: 10
  maxExecutionTime: 120

# ── Computer-Use Agent ──
fenrir:
  enabled: true
  image: ghcr.io/megawiz-dev-team/fenrir:latest
  nodePort: 30200

# ── E2E Testing ──
forseti:
  enabled: true
  image: ghcr.io/megawiz-dev-team/forseti:latest
  nodePort: 30555
  storage: 1Gi

# ── MCP Sidecar ──
hermodr:
  enabled: true
  image: ghcr.io/megawiz-dev-team/hermodr-yggdrasil:latest

# ── Browser Service ──
ratatoskr:
  enabled: true
  image: ghcr.io/megawiz-dev-team/ratatoskr:latest

# ── Load Testing ──
mjolnir:
  enabled: true
  image: ghcr.io/megawiz-dev-team/mjolnir:latest
  storage: 1Gi



# ── Laminar (Sága) ──
# Disabled in umbrella chart — managed by separate `laminar` Helm release.
# Re-enabling requires migrating ownership of 45 laminar resources first.
laminar:
  enabled: false

# ── Monitoring ──
vardr:
  enabled: true
  image: ghcr.io/megawiz-dev-team/vardr:latest
  nodePort: 30090

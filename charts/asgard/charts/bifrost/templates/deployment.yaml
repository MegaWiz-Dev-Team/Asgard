apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  labels: { app: bifrost }
spec:
  replicas: 1
  selector:
    matchLabels: { app: bifrost }
  template:
    metadata:
      labels: { app: bifrost }
    spec:
      {{- with .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: bifrost
          image: {{ .Values.image | default "ghcr.io/megawiz-dev-team/bifrost:latest" }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports: [{ containerPort: 8100 }]
          env:
            - { name: BIFROST_HOST, value: "0.0.0.0" }
            - { name: BIFROST_PORT, value: "8100" }
            # Bifrost's main.rs panics on missing DATABASE_URL. Sourced
            # from the shared asgard-secrets so the Sprint 51e mariadb
            # rotation flows here automatically. MIMIR_DATABASE_URL
            # carries the full `mysql://user:pass@host:port/db` string.
            # Sprint 51e hand-patched this onto the running deployment;
            # this template makes it permanent so `helm upgrade` doesn't
            # lose it on recreate.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretsName | default "asgard-secrets" }}
                  key: MIMIR_DATABASE_URL
            - { name: HEIMDALL_URL, value: {{ .Values.global.heimdallUrl | quote }} }
            - name: HEIMDALL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretsName | default "asgard-secrets" }}
                  key: HEIMDALL_API_KEY
            - { name: MIMIR_URL, value: "http://mimir-api.{{ .Release.Namespace }}.svc:8080" }
            # KB grounding whitelist (chat agents). Multi-seed A/B 2026-05-31:
            # stacking all KBs regressed -16pp; a single KB was neutral vs none
            # (within seed noise, n=20). So chat defaults to OFF — KB grounding
            # is reserved for the deterministic coding/factual path (Iris).
            # Set to a single kb_id (e.g. "symptoms") to re-enable; never stack.
            - { name: KB_ALLOW_KBS, value: {{ .Values.kbAllowKbs | default "none" | quote }} }
            # OTLP traces -> otel-collector -> Laminar. Code default is
            # localhost:4317 (wrong in k8s) so spans silently stopped landing on
            # 2026-05-21; this points it at the in-cluster collector.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.{{ .Release.Namespace }}.svc:4317" }
            - { name: OTEL_SERVICE_NAME, value: "bifrost" }
            - { name: YGGDRASIL_MCP_URL, value: "http://hermodr.{{ .Release.Namespace }}.svc:8090/rpc" }
            - { name: YGGDRASIL_MCP_ENABLED, value: "true" }
            - { name: DEFAULT_MODEL, value: {{ .Values.defaultModel | default "mlx-community/Qwen3.5-9B-MLX-4bit" | quote }} }
            - { name: MAX_ITERATIONS, value: {{ .Values.maxIterations | default 10 | quote }} }
            - { name: MAX_EXECUTION_TIME, value: {{ .Values.maxExecutionTime | default 120 | quote }} }
            - { name: AUTH_ENABLED, value: "false" }
            - { name: LOG_LEVEL, value: {{ .Values.global.logLevel | default "info" | quote }} }
          readinessProbe:
            httpGet: { path: /healthz, port: 8100 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 512Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: bifrost
spec:
  type: NodePort
  selector: { app: bifrost }
  ports:
    - port: 8100
      targetPort: 8100
      nodePort: {{ .Values.nodePort | default 30100 }}

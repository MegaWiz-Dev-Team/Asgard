[package]
name = "loki-api"
version = "0.1.0"
edition = "2021"
description = "Loki Security Testing API — MCP handlers for authorized penetration testing"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
regex = "1"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
